
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AroXi Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:white;font-family:Arial,sans-serif}
header{padding:24px;background:linear-gradient(120deg,#075bdb,#c51d55);font-size:26px;font-weight:bold}
main{max-width:500px;margin:auto;padding:20px}
.card{background:#151d30;border:1px solid #26344e;border-radius:18px;padding:20px;margin-top:18px}
input,button{width:100%;padding:14px;border:0;border-radius:10px;margin:7px 0;font-size:16px}
input{background:#26334b;color:white}
button{background:#1267e9;color:white;font-weight:bold}
.secondary{background:#b91e4c}
#app{display:none}
.msg{background:#26334b;padding:12px;border-radius:12px;margin:9px 0}
small{color:#9aabc7}
</style>
</head>
<body>
<header>💬 AroXi Chat</header>
<main>
<section id="login" class="card">
<h2>Hoş geldin!</h2>
<p>AroXi Chat'e giriş yap veya hesap oluştur.</p>
<input id="email" type="email" placeholder="E-posta">
<input id="password" type="password" placeholder="Şifre">
<button onclick="register()">Hesap oluştur</button>
<button class="secondary" onclick="loginUser()">Giriş yap</button>
<p id="status"></p>
</section>
<section id="app">
<div class="card">
<h2 id="welcome">AroXi Chat</h2>
<input id="friend" placeholder="Arkadaşının e-postası">
<button onclick="openChat()">Sohbeti aç</button>
<button class="secondary" onclick="logout()">Çıkış yap</button>
</div>
<div class="card">
<h3 id="chatTitle">Sohbet</h3>
<div id="messages"></div>
<input id="message" placeholder="Mesajını yaz...">
<button onclick="sendMessage()">Gönder</button>
</div>
</section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,query,where,orderBy,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyA4L9vTAZHQYkPweCXATplEaRIIEZumyVg",
authDomain:"aroxi-chat.firebaseapp.com",
projectId:"aroxi-chat",
storageBucket:"aroxi-chat.firebasestorage.app",
messagingSenderId:"707142258691",
appId:"1:707142258691:web:e748022ad060c8b62a7e36"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let currentFriend="";
let unsubscribe=null;

window.register=async()=>{
try{await createUserWithEmailAndPassword(auth,email.value,password.value);status.textContent="Hesap oluşturuldu!";}
catch(e){status.textContent=e.message;}
};
window.loginUser=async()=>{
try{await signInWithEmailAndPassword(auth,email.value,password.value);}
catch(e){status.textContent=e.message;}
};
onAuthStateChanged(auth,user=>{
login.style.display=user?"none":"block";
document.getElementById("app").style.display=user?"block":"none";
if(user)welcome.textContent="Merhaba, "+user.email;
});
window.openChat=()=>{
currentFriend=friend.value.trim().toLowerCase();
if(!currentFriend||currentFriend===auth.currentUser.email){alert("Geçerli bir arkadaş e-postası yaz.");return;}
chatTitle.textContent=currentFriend+" ile sohbet";
if(unsubscribe)unsubscribe();
const q=query(collection(db,"messages"),where("members","==",[auth.currentUser.email,currentFriend].sort().join("|")),orderBy("createdAt"));
unsubscribe=onSnapshot(q,snapshot=>{
messages.innerHTML="";
snapshot.forEach(doc=>{
const m=doc.data();
const div=document.createElement("div");
div.className="msg";
div.textContent=(m.sender===auth.currentUser.email?"Sen: ":"Arkadaşın: ")+m.text;
messages.appendChild(div);
});
});
};
window.sendMessage=async()=>{
const text=message.value.trim();
if(!text||!currentFriend)return;
try{
await addDoc(collection(db,"messages"),{
members:[auth.currentUser.email,currentFriend].sort().join("|"),
sender:auth.currentUser.email,
text,
createdAt:serverTimestamp()
});
message.value="";
}catch(e){alert("Mesaj gönderilemedi: "+e.message);}
};
window.logout=()=>signOut(auth);
</script>
</body>
</html>
